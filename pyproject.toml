[project]
name = "wp-denetim"
version = "1.0.0"
description = "Passive security audit for WordPress sites, with terminal, HTML and JSON reports"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "İlker Tokat" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "rich>=13", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wp-denetim = "wpdenetim.cli:run"

[tool.setuptools]
packages = ["wpdenetim"]
